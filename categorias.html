<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🗂️ Categorías</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <aside>
      <div class="sidebar-logo">
        <h1>🎥 <span class="logo-accent">VID</span>VAULT</h1>
      </div>
      <div class="nav-section">
        <label>Navegación</label>
        <button onclick="window.location.href = 'index.html'">
          <span class="nav-icon">🏠</span> Volver a Videos
        </button>
        <button onclick="window.location.href = 'actrices.html'">
          <span class="nav-icon">🌟</span> Actrices
        </button>
        <button onclick="abrirModalNuevaCategoria()">
          <span class="nav-icon">➕</span> Nueva Categoría
        </button>
      </div>
    </aside>

    <main>
      <div class="tab active" id="categoriaTab">
        <div class="main-header">
          <div>
            <h2>Categorías</h2>
            <p id="categoriaSubtitle">Cargando…</p>
          </div>
        </div>
        <div style="padding: 0 28px">
          <div class="search-bar" style="margin-bottom: 20px">
            <div class="search-wrap">
              <span class="search-icon">🔍</span>
              <input
                type="text"
                id="buscadorCategoria"
                placeholder="Buscar categoría…"
                oninput="filtrarCategorias()"
              />
            </div>
          </div>
          <div class="galeria-categorias" id="galeriaCategorias"></div>
        </div>
      </div>
    </main>

    <!-- MODAL -->
    <div class="modal-overlay" id="modalOverlay" onclick="cerrarModal(event)">
      <div class="modal">
        <button class="modal-close" onclick="cerrarModalBtn()">✕</button>
        <h3 id="modalTitle">✏️ Categoría</h3>
        <div id="modalBody"></div>
        <div class="modal-actions">
          <button class="btn-cancel" onclick="cerrarModalBtn()">
            Cancelar
          </button>
          <button class="btn-confirm" id="modalConfirm">Guardar</button>
        </div>
      </div>
    </div>

    <div id="toast-container"></div>

    <script src="scripts.js"></script>
    <script>
      function abrirModalNuevaCategoria() {
        abrirModal(
          "➕ Nueva Categoría",
          `
        <div class="form-group"><label>Nombre</label><input type="text" id="mNombreCat" placeholder="Nombre de la categoría"></div>
        <div class="form-group"><label>URL de imagen (opcional)</label><input type="text" id="mImagenCat" placeholder="https://…"></div>
      `,
          () => {
            const nombre = document.getElementById("mNombreCat").value.trim();
            const imagenUrl = document
              .getElementById("mImagenCat")
              .value.trim();
            if (!nombre) return showToast("El nombre es obligatorio", "error");

            let categorias = getData(categoriasKey);
            const existe = categorias.some(
              (c) => (typeof c === "string" ? c : c.nombre) === nombre,
            );
            if (existe) return showToast("Esta categoría ya existe", "error");

            categorias.push(imagenUrl ? { nombre, imagenUrl } : nombre);
            setData(categoriasKey, categorias);
            cerrarModalBtn();
            cargarCategorias();
            showToast(`${nombre} agregada ✓`, "success");
          },
        );
      }

      document.addEventListener("DOMContentLoaded", () => {
        if (!sessionStorage.getItem("autenticado")) {
          window.location.href = "index.html";
        } else {
          cargarCategorias();
        }
      });
    </script>
  </body>
</html>
